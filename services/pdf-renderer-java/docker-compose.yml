services:
  pdf-signer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-signer:local
    ports:
      - "127.0.0.1:8080:8081"

    # 内存限额。没有这一项时 JVM 的 MaxRAMPercentage 是按*宿主机*内存算的，
    # 于是在与数据库共用的小主机上它会一路涨到把整机拖进 swap —— 生产曾因此
    # 单次签章卡住 6 分钟，并被内核 OOM 杀掉（一天两次，另有一次杀的是 mysqld）。
    #
    # memswap_limit 与 mem_limit 相等表示不允许该容器使用 swap：宁可这一个请求
    # 失败并由 restart 拉起，也不要把整台机器冻住。
    #
    # 768m 的依据：本地实测 6.5MB / 14 页的图片型报告在 128m 堆下即可完成，
    # 按 70% 取堆约 537m，留了 4 倍余量给并发与更大的文件，其余供
    # metaspace / 代码缓存 / 直接内存 / 线程栈使用。
    mem_limit: ${PDF_SIGNER_MEM_LIMIT:-768m}
    memswap_limit: ${PDF_SIGNER_MEM_LIMIT:-768m}

    environment:
      # 覆盖镜像内的默认值，改为按容器限额取堆，而不是按宿主机。
      JAVA_TOOL_OPTIONS: ${PDF_SIGNER_JAVA_OPTS:--XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200}

      # 每个签名域预留的字节数。代码默认 512KB，而实测真实 PKCS#7 签名最大只用
      # 1623 字节 —— 多出来的空洞不只是撑大文件：首页章会先把文档撑大约 2MB，
      # 之后骑缝章的每一次逐页增量保存都要重写这个更大的文档。
      #
      # 实测（13 页 / 6MB 报告）：512KB → 8.7s / 输出 8.3MB；
      # 32KB → 4.8s / 输出 6.4MB，签名域数量一致，验证与防篡改检测均正常。
      # 32KB 仍留有约 20 倍余量；若将来启用 TSA 时间戳需要更多空间，调大即可。
      SIGNATURE_RESERVED_SIZE: ${PDF_SIGNER_SIGNATURE_RESERVED_SIZE:-32768}

      DEFAULT_PFX_PATH: ${DEFAULT_PFX_PATH:-/keys/signer.pfx}
      DEFAULT_PFX_PASS: ${DEFAULT_PFX_PASS:?DEFAULT_PFX_PASS is required}
      PDF_SERVICE_BIND_ADDRESS: 0.0.0.0
      PDF_SERVICE_HMAC_ENABLED: "true"
      PDF_SERVICE_HMAC_ACTIVE_KEY_ID: ${PDF_SERVICE_HMAC_ACTIVE_KEY_ID:-primary}
      PDF_SERVICE_HMAC_KEYS: ${PDF_SERVICE_HMAC_KEYS:?PDF_SERVICE_HMAC_KEYS is required}
      PDF_SERVICE_HMAC_NONCE_STORE: redis
      PDF_SERVICE_REDIS_HOST: redis
      PDF_SIGNING_HASH_ALGO: SHA256
      PDF_PADES_TSA_URL: ${PDF_PADES_TSA_URL:?PDF_PADES_TSA_URL is required}
      PDF_PADES_TSA_POLICY_OID: ${PDF_PADES_TSA_POLICY_OID:-}
      PDF_PADES_TSA_TRUSTED_CERT_SHA256: ${PDF_PADES_TSA_TRUSTED_CERT_SHA256:?PDF_PADES_TSA_TRUSTED_CERT_SHA256 is required}
      PDF_PADES_SIGNER_TRUSTED_ROOT_SHA256: ${PDF_PADES_SIGNER_TRUSTED_ROOT_SHA256:?PDF_PADES_SIGNER_TRUSTED_ROOT_SHA256 is required}
      PDF_EXECUTION_LEDGER_ENABLED: "true"
      PDF_EXECUTION_DB_URL: ${PDF_EXECUTION_DB_URL:?PDF_EXECUTION_DB_URL is required}
      PDF_EXECUTION_DB_USERNAME: ${PDF_EXECUTION_DB_USERNAME:?PDF_EXECUTION_DB_USERNAME is required}
      PDF_EXECUTION_DB_PASSWORD: ${PDF_EXECUTION_DB_PASSWORD:?PDF_EXECUTION_DB_PASSWORD is required}
      PDF_EXECUTION_RESULT_ROOT: /data/signing-results
      FUNCTION_STAMP_TOP_MARGIN_MM: ${FUNCTION_STAMP_TOP_MARGIN_MM:-32}
      FUNCTION_STAMP_LEFT_MARGIN_MM: ${FUNCTION_STAMP_LEFT_MARGIN_MM:-25}
      FRONT_SEAL_OFFSET_LEFT_MM: ${FRONT_SEAL_OFFSET_LEFT_MM:-45}
      FRONT_SEAL_OFFSET_UP_MM: ${FRONT_SEAL_OFFSET_UP_MM:-8}
      FRONT_SEAL_PAGE3_OFFSET_LEFT_MM: ${FRONT_SEAL_PAGE3_OFFSET_LEFT_MM:-15}
      FRONT_SEAL_PAGE3_OFFSET_UP_MM: ${FRONT_SEAL_PAGE3_OFFSET_UP_MM:-5}
      FRONT_SEAL_SIZE_MM: ${FRONT_SEAL_SIZE_MM:-40}
      PERFORATION_STAMP_HEIGHT_MM: ${PERFORATION_STAMP_HEIGHT_MM:-40}
      PERFORATION_MULTI_STATE_APPEARANCE: false
      PDF_FONT_PATH: ${PDF_FONT_PATH:-/fonts/LimsSongSC-Regular.ttf}

      # 二维码配置
      QR_CODE_SIZE_MM: ${QR_CODE_SIZE_MM:-28.6}
      QR_CODE_MARGIN_MM: ${QR_CODE_MARGIN_MM:-1}
      QR_CODE_OFFSET_LEFT_MM: ${QR_CODE_OFFSET_LEFT_MM:-16}
      QR_CODE_OFFSET_TOP_MM: ${QR_CODE_OFFSET_TOP_MM:-40}
      QR_CODE_WIDTH_PX: ${QR_CODE_WIDTH_PX:-360}
      QR_CODE_HEIGHT_PX: ${QR_CODE_HEIGHT_PX:-360}

      CERTIFICATE_QUERY_BASE_URL: ${CERTIFICATE_QUERY_BASE_URL:-https://www.verify-pdf.com/certificate-query}
      
    volumes:
      - ./keys:/keys:ro
      - ./fonts:/fonts:ro
      - ${PDF_EXECUTION_RESULT_ROOT_HOST:?PDF_EXECUTION_RESULT_ROOT_HOST is required}:/data/signing-results
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - pdf-hmac-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pdf-hmac-redis:

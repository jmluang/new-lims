[package]
name = "lims-render"
version = "0.1.0"
edition = "2024"
[dependencies]
lims-core = { path = "../core" }
lims-images = { path = "../images" }
lopdf = { version = "=0.44.0", default-features = false }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
ttf-parser = "=0.25.1"
subsetter = "=0.2.6"
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
regex = "1"
unicode-normalization = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
rxing = { version = "=0.9.2", default-features = false, features = ["qrcode", "encoding_rs", "encoders"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
chrono = { version = "0.4", features = ["clock"] }

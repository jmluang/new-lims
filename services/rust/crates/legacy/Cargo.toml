[package]
name = "lims-legacy"
version = "0.1.0"
edition = "2024"
[dependencies]
lims-core = { path = "../core" }
lims-crypto = { path = "../crypto" }
lims-render = { path = "../render" }
lims-images = { path = "../images" }
lopdf = { version = "=0.44.0", default-features = false }
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "=0.3.2"
libc = "0.2"
memmap2 = "0.9"
tempfile = "3"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

